<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurens Massee — Product Strategist</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Left side - Profile image with fade */
    .profile-section {
      position: absolute;
      left: 0;
      top: 0;
      width: 55%;
      height: 100%;
      z-index: 1;
    }

    .profile-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Fade overlays */
    .profile-section::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        linear-gradient(to right, transparent 40%, #000 100%),
        linear-gradient(to bottom, transparent 60%, #000 100%),
        linear-gradient(to top, transparent 80%, #000 100%);
      pointer-events: none;
    }

    /* Right side - Content */
    .content-section {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem;
      padding-left: 55%;
    }

    .masthead {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      color: #fff;
    }

    .body-text {
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.7);
      max-width: 480px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .profile-section {
        width: 100%;
        height: 50vh;
      }

      .profile-section::after {
        background: 
          linear-gradient(to bottom, transparent 40%, #000 100%);
      }

      .content-section {
        padding: 2rem;
        padding-top: 55vh;
        padding-left: 2rem;
        justify-content: flex-start;
      }

      .masthead {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="profile-section">
      <img src="profile.jpg" alt="Laurens Massee" class="profile-image">
    </div>

    <div class="content-section">
      <h1 class="masthead">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</h1>
      <p class="body-text">Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit.</p>
    </div>
  </div>
</body>
</html>
